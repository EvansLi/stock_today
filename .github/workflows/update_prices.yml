name: Update Prices

on:
  schedule:
    # 星期一到星期五，UTC 時間 21:30 (台北時間 05:30)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch stock prices
        run: python scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          if git diff --staged --quiet; then
            echo "No changes in prices.json"
          else
            git commit -m "chore: auto-update stock prices [skip ci]"
            git push
          fi
